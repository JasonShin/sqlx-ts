name: release.yaml
on:
  release:
    types: [created]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "Release tag $TAG must look like v1.2.3"
            exit 1
          fi
        env:
          TAG: ${{ github.event.release.tag_name }}

  assets:
    runs-on: ${{ matrix.os }}
    needs: version-check
    strategy:
      matrix:
        # Include all "Tier 1 with Host Tools" targets and "Tier 2 with Host Tools" targets for Windows and macOS,
        # excluding *-pc-windows-msvc, which requires cross-toolchains. Goal is one option per OS per architecture.
        # https://doc.rust-lang.org/rustc/platform-support.html
        # https://github.com/cross-rs/cross#supported-targets
        # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
        include:
          # 32-bit (i686)
          # i686-apple-darwin is Tier 3.
          - build: linux-32-bit
            os: ubuntu-latest
            target: i686-unknown-linux-musl
            command: cross
          - build: windows-32-bit
            os: windows-latest
            target: i686-pc-windows-msvc
            command: cargo
          # 64-bit (x86)
          - build: linux-64-bit
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            command: cross
          - build: macos-64-bit
            os: macos-latest
            target: x86_64-apple-darwin
            command: cargo
          - build: windows-64-bit
            os: windows-latest
            target: x86_64-pc-windows-msvc
            command: cargo
          # 64-bit (ARM)
          # aarch64-pc-windows-gnullvm is Tier 3.
          - build: macos-arm
            os: macos-latest
            target: aarch64-apple-darwin
            command: cargo
          - build: linux-arm
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            command: cross
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install packages (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ci/ubuntu-install-packages
      - name: Set version from release tag
        shell: bash
        run: perl -pi.bak -e "s/^version = \".*\"/version = \"${TAG#v}\"/" Cargo.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: cargo install cross --git https://github.com/cross-rs/cross
      - run: ${{ matrix.command }} build --release --target ${{ matrix.target }}
      - run: ls target

      - name: Build archive
        shell: bash
        run: |
          DIRECTORY="sqlx-ts-${{ github.event.release.tag_name }}-${{ matrix.build }}"
          if [[ "${{ matrix.target }}" =~ "-pc-windows-" ]]; then
            SUFFIX=".exe"
          else
            SUFFIX=""
          fi
          mkdir "$DIRECTORY"
          cp "target/${{ matrix.target }}/release/sqlx-ts$SUFFIX" "$DIRECTORY"
          7z a "$DIRECTORY.zip" "$DIRECTORY"
          echo "ASSET=$DIRECTORY.zip" >> $GITHUB_ENV

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell -Command "(Get-FileHash -Algorithm SHA256 '${{ env.ASSET }}').Hash.ToLower()" > "${{ env.ASSET }}.sha256"
          else
            shasum -a 256 "${{ env.ASSET }}" | awk '{print $1}' > "${{ env.ASSET }}.sha256"
          fi
          cat "${{ env.ASSET }}.sha256"

      - name: Upload release archive
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256          

  node:
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./node
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm version "${TAG#v}" --no-git-tag-version
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: npm publish --access public

  bump-version:
    needs: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - run: |
          VERSION="${TAG#v}"
          perl -pi -e "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          perl -0pi -e "s/(name = \"sqlx-ts\"\nversion = )\".*?\"/\$1\"$VERSION\"/" Cargo.lock
          (cd node && npm version "$VERSION" --no-git-tag-version)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git push origin main
        env:
          TAG: ${{ github.event.release.tag_name }}
